services:
  bot:
    build: .
    env_file: .env
    environment:
      DATA_DIR: /app/data
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    volumes:
      - astra-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '3'
volumes:
  astra-data:
